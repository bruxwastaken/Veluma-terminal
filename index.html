<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veluma // Advanced On-Chain Execution Suite</title>
    <style>
        :root { 
            --bg: #030303; 
            --panel: #09090b; 
            --panel-card: #0d0d12;
            --panel-inner: #14141a;
            --border: #1a1a24; 
            --border-glow: #27273a;
            --text-main: #f4f4f5; 
            --text-secondary: #71717a; 
            --accent: #2563eb; 
            --accent-glow: #3b82f6;
            --neon: #10b981; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 60px 24px;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }
        .wrapper { max-width: 1200px; margin: 0 auto; width: 100%; display: block; }
        
        /* Premium Background Ambient Glow Orb Matrix */
        .glow-orb-top {
            position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
            width: 800px; height: 400px; background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, rgba(0,0,0,0) 70%);
            z-index: -1; pointer-events: none;
        }

        /* Top Navigation Header Area */
        nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 30px; margin-bottom: 60px; border-bottom: 1px solid var(--border); width: 100%; }
        .nav-logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

        /* Marketing Style Text Hero Block Section */
        .hero-section { text-align: center; max-width: 800px; margin: 0 auto 70px auto; width: 100%; display: block; }
        .hero-section h2 { font-size: 54px; font-weight: 800; line-height: 1.1; color: #fff; letter-spacing: -2px; margin-bottom: 20px; }
        .hero-section h2 span { background: linear-gradient(135deg, #fff 30%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-section p.hero-desc { font-size: 18px; color: var(--text-secondary); line-height: 1.6; max-width: 650px; margin: 0 auto; }

        /* Telemetry Data Grid Box Row Component */
        .telemetry-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 32px 0; margin-bottom: 80px; width: 100%; }
        .telemetry-node { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tel-label { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tel-value { font-size: 26px; color: #fff; font-weight: 800; letter-spacing: -0.5px; }
        
        /* PIXEL PERFECT INLINE SVG LOGO MATRIX BLOCK MATCHING SPECIFIC IMAGES */
        .chain-icons-container { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 6px; height: 26px; }
        .chain-svg-wrapper { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: #09090b; border: 1px solid #1c1c24; box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 4px; }
        .chain-svg-wrapper svg { width: 100%; height: 100%; object-fit: contain; }

        .section-title { font-size: 22px; color: #fff; font-weight: 700; margin-bottom: 30px; width: 100%; display: block; clear: both; letter-spacing: -0.5px; }

        /* RE-ENGINEERED CONTAINER MATRIX */
        .features-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 100px; width: 100%; clear: both; }
        .feature-card { background: var(--panel); border: 1px solid var(--border); padding: 28px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; justify-content: space-between; min-height: 440px; box-sizing: border-box; transition: all 0.2s ease-in-out; }
        .feature-card:hover { border-color: var(--border-glow); box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform: translateY(-2px); }
        .card-header-meta { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .card-header-meta h4 { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
        .card-desc { color: var(--text-secondary); font-size: 13px; line-height: 1.6; min-height: 60px; display: block; }
        
        /* High-End Simulated Product Interface Styles */
        .interactive-container-panel { background: var(--panel-inner); border: 1px solid var(--border); padding: 16px; border-radius: 8px; font-size: 12px; width: 100%; box-sizing: border-box; display: block; margin-top: auto; border-left: 2px solid var(--accent); }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; width: 100%; }
        .panel-label { color: var(--text-secondary); font-weight: 500; }
        .panel-value-accent { color: #fff; font-weight: 600; background: #1c1c24; padding: 3px 8px; border-radius: 4px; font-family: monospace; }
        
        .checkbox-item-wrapper { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; margin-top: 8px; width: 100%; }
        .checkbox-mock-indicator { width: 14px; height: 14px; background: var(--accent); border-radius: 3px; display: flex; align-items: center; justify-content: center; }
        .checkbox-mock-indicator::after { content: ""; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); display: block; margin-top: -2px; }
        
        .input-mock-field { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 10px 12px; color: #fff; font-family: monospace; border-radius: 6px; font-size: 11px; margin-top: 8px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; box-sizing: border-box; display: block; }
        .balance-pill-badge { font-size: 10px; color: var(--neon); background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); padding: 2px 6px; border-radius: 4px; font-weight: 600; }

        .toggle-options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; width: 100%; }
        .toggle-opt-node { background: var(--bg); border: 1px solid var(--border); padding: 6px; border-radius: 4px; text-align: center; color: var(--text-secondary); font-size: 11px; font-weight: 600; }
        .toggle-opt-node.active-node-state { background: #fff; color: #000; font-weight: 700; }

        .feature-action { display: block; background: #fff; color: #000; padding: 14px; font-size: 13px; text-decoration: none; font-weight: 700; border-radius: 6px; text-align: center; transition: background 0.2s, transform 0.2s; width: 100%; box-sizing: border-box; margin-top: 16px; }
        .feature-action:hover { background: #e4e4e7; transform: translateY(-1px); }

        /* Draggable Action Base Box Container Panel */
        .bookmarklet-box { border-top: 1px solid var(--border); padding: 120px 24px; text-align: center; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 24px 24px; margin-bottom: 60px; width: 100%; display: block; clear: both; }
        .box-title { font-size: 46px; color: #fff; margin-bottom: 32px; font-weight: 800; letter-spacing: -2px; }
        .drag-node-anchor { display: inline-block; background: #fff; color: #000; padding: 16px 36px; font-weight: 700; font-size: 15px; text-decoration: none; border-radius: 6px; cursor: move; border: 1px solid #fff; transition: all 0.2s ease; box-shadow: 0 10px 30px rgba(255,255,255,0.05); text-transform: uppercase; font-family: monospace; }
        .drag-node-anchor:hover { background: #e4e4e7; border-color: #e4e4e7; }
        
        /* Structured Footer Link Mapping Matrix Layout Columns */
        footer { border-top: 1px solid var(--border); padding: 80px 0; margin-top: 80px; display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; }
        .footer-left { max-width: 300px; }
        .footer-logo { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 12px; letter-spacing: -0.5px; }
        .footer-subtext { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
        .footer-links-grid { display: flex; gap: 100px; }
        .footer-col h5 { color: #fff; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; font-weight: 700; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 12px; }
        .footer-col ul li a { color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .footer-col ul li a:hover { color: #fff; }

        @media(max-width: 992px) { .features-layout { grid-template-columns: 1fr; gap: 30px; } .telemetry-row { grid-template-columns: 1fr; gap: 20px; padding: 24px 0; } .footer-links-grid { gap: 40px; flex-wrap: wrap; } footer { flex-direction: column; gap: 40px; } }
    </style>
</head>
<body>

    <div class="glow-orb-top"></div>

    <div class="wrapper">
        <nav>
            <div class="nav-logo">Veluma</div>
        </nav>

        <div class="hero-section">
            <h2><span>Track on-chain data instantly.</span><br>No delay. No noise.</h2>
            <p class="hero-desc">Independent on-chain execution architecture. Run instant bundle analysis, map hidden distribution paths, and secure your wallet entries straight from your viewport layer.</p>
        </div>

        <div class="telemetry-row">
