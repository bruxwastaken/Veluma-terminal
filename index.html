<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veluma // Rapid Toolkit</title>
    <!-- GLOBAL ENTERPRISE ASSET ENGINE LOAD -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        :root { 
            --bg: #030303; 
            --panel: #09090b; 
            --panel-card: #0d0d12;
            --panel-inner: #14141a;
            --border: #1a1a24; 
            --border-glow: #27273a;
            --text-main: #f4f4f5; 
            --text-secondary: #71717a; 
            --accent: #2563eb; 
            --accent-glow: #3b82f6;
            --neon: #10b981; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 40px 20px;
        }
        .wrapper { max-width: 1100px; margin: 0 auto; width: 100%; display: block; }
        
        /* Top Navigation Header Area */
        nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 30px; margin-bottom: 50px; border-bottom: 1px solid var(--border); width: 100%; }
        .nav-logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

        /* Marketing Style Text Hero Block Section */
        .hero-section { text-align: center; max-width: 750px; margin: 0 auto 60px auto; width: 100%; display: block; }
        .hero-section h2 { font-size: 48px; font-weight: 800; line-height: 1.1; color: #fff; letter-spacing: -1.5px; margin-bottom: 16px; }
        .hero-section p.hero-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.6; }

        /* Telemetry Data Grid Box Row */
        .telemetry-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 24px 0; margin-bottom: 60px; width: 100%; }
        .telemetry-node { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tel-label { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tel-value { font-size: 24px; color: #fff; font-weight: 800; }
        
        /* STABLE HIGH-FIDELITY VECTOR ICON SYSTEM: PIXEL PERFECT RAPIDLAUNCH GRAPHICS REPLICA */
        .chain-icons-container { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 4px; }
        .chain-vector-badge { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; background: #0c0c10; border: 1px solid #1c1c24; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .v-sol { color: #14f195; }
        .v-bsc { color: #f3ba2f; }
        .v-sui { color: #6fbcf0; }
        .v-base { color: #0052ff; }
        .v-mvt { color: #ffffff; font-family: monospace; font-size: 11px; }
        .v-eth { color: #627eea; }
        .v-pump { color: #86efac; }
        .v-sonic { color: #ff007a; }
        .v-arb { color: #28a0f0; }

        .section-title { font-size: 20px; color: #fff; font-weight: 700; margin-bottom: 24px; width: 100%; display: block; clear: both; margin-top: 20px; }

        /* RE-ENGINEERED CONTAINER MATRIX: FORCES ENTIRE BLOCK FLOW TO VISUALLY RENDER UNDER THE LABEL TITLE */
        .features-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; width: 100%; clear: both; }
        .feature-card { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 10px; display: flex; flex-direction: column; gap: 16px; justify-content: space-between; min-height: 410px; box-sizing: border-box; }
        .feature-card:hover { border-color: var(--border-glow); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .card-header-meta { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .card-header-meta h4 { color: #fff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-header-meta h4 i { color: var(--accent-glow); font-size: 14px; }
        .card-desc { color: var(--text-secondary); font-size: 12px; line-height: 1.5; min-height: 55px; display: block; }
        
        .interactive-container-panel { background: var(--panel-inner); border: 1px solid var(--border); padding: 14px; border-radius: 6px; font-size: 11px; width: 100%; box-sizing: border-box; display: block; margin-top: auto; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%; }
        .panel-label { color: var(--text-secondary); }
        .panel-value-accent { color: #fff; font-weight: 600; background: #1c1c24; padding: 2px 6px; border-radius: 3px; }
        
        .checkbox-item-wrapper { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; margin-top: 6px; width: 100%; }
        .checkbox-mock-indicator { width: 12px; height: 12px; background: var(--accent); border-radius: 2px; display: flex; align-items: center; justify-content: center; }
        .checkbox-mock-indicator::after { content: "✓"; color: #fff; font-size: 8px; font-weight: bold; }
        
        .input-mock-field { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; color: #fff; font-family: monospace; border-radius: 4px; font-size: 10px; margin-top: 6px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; box-sizing: border-box; display: block; }
        .balance-pill-badge { font-size: 9px; color: var(--neon); background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); padding: 2px 5px; border-radius: 3px; }

        .toggle-options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; width: 100%; }
        .toggle-opt-node { background: var(--bg); border: 1px solid var(--border); padding: 4px; border-radius: 3px; text-align: center; color: var(--text-secondary); font-size: 10px; }
        .toggle-opt-node.active-node-state { background: #fff; color: #000; font-weight: bold; }

        .feature-action { display: block; background: #fff; color: #000; padding: 12px; font-size: 12px; text-decoration: none; font-weight: 700; border-radius: 4px; text-align: center; transition: background 0.2s; width: 100%; box-sizing: border-box; margin-top: 12px; }
        .feature-action:hover { background: #e4e4e7; }

        /* Draggable Action Base Box */
        .bookmarklet-box { border-top: 1px solid var(--border); padding: 100px 20px; text-align: center; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px; margin-bottom: 40px; width: 100%; display: block; clear: both; }
        .box-title { font-size: 42px; color: #fff; margin-bottom: 30px; font-weight: 700; letter-spacing: -1.5px; }
        .drag-node-anchor { display: inline-block; background: #fff; color: #000; padding: 14px 28px; font-weight: 500; font-size: 14px; text-decoration: none; border-radius: 4px; cursor: move; border: 1px solid #fff; transition: all 0.2s ease; }
        .drag-node-anchor:hover { background: #e4e4e7; border-color: #e4e4e7; }
        
        /* Link Columns Box Container Layout matches screenshot image */
        footer { border-top: 1px solid var(--border); padding: 60px 0; margin-top: 60px; display: flex; justify-content: space-between; width: 100%; }
        .footer-left { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .footer-logo { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px; }
        .footer-subtext { color: var(--text-secondary); font-size: 12px; }
        .footer-links-grid { display: flex; gap: 80px; }
        .footer-col h5 { color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 600; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 10px; }
        .footer-col ul li a { color: var(--text-secondary); text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .footer-col ul li a:hover { color: #fff; }

        @media(max-width: 900px) { .features-layout { grid-template-columns: 1fr; } .telemetry-row { grid-template-columns: 1fr; gap: 15px; } footer { flex-direction: column; gap: 30px; } .footer-links-grid { gap: 40px; } }
    </style>
</head>
<body>

    <div class="wrapper">
        <nav>
            <div class="nav-logo">Veluma</div>
        </nav>

        <div class="hero-section">
            <h2><span>Track on-chain data instantly.</span><br>No delay. No noise.</h2>
            <p class="hero-desc">Independent on-chain execution architecture. Run instant bundle analysis, map hidden distribution paths, and secure your wallet entries straight from your viewport layer.</p>
        </div>

        <!-- Telemetry Data Grid Box Row -->
        <div class="telemetry-row">
            <div class="telemetry-node">
                <div class="tel-label"><i class="fa-solid fa-bolt" style="color:var(--accent-glow);"></i> Delay</div>
                <div class="tel-value">0.00ms</div>
            </div>
            <div class="telemetry-node">
                <div class="tel-label"><i class="fa-solid fa-users" style="opacity:0.7;"></i> Total Users</div>
                <div class="tel-value">21K+</div>
            </div>
