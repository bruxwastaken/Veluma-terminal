<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veluma // Toolkit</title>
    <style>
        :root { 
            --bg: #030303; 
            --panel: #09090b; 
            --panel-card: #0d0d12;
            --panel-inner: #14141a;
            --border: #1a1a24; 
            --border-glow: #27273a;
            --text-main: #f4f4f5; 
            --text-secondary: #71717a; 
            --accent: #2563eb; 
            --accent-glow: #3b82f6;
            --neon: #10b981; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 40px 20px;
        }
        .wrapper { max-width: 1100px; margin: 0 auto; }
        
        /* Top Navigation Header Area */
        nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 30px; margin-bottom: 50px; border-bottom: 1px solid var(--border); }
        .nav-logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

        /* Marketing Style Text Hero Block Section */
        .hero-section { text-align: center; max-width: 750px; margin: 0 auto 60px auto; }
        .hero-section h2 { font-size: 48px; font-weight: 800; line-height: 1.1; color: #fff; letter-spacing: -1.5px; margin-bottom: 16px; }
        .hero-section p.hero-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.6; }

        /* FIXED STABLE GRID LAYOUT: Forces data rows to sit side-by-side cleanly */
        .telemetry-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 24px 0; margin-bottom: 60px; }
        .telemetry-node { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tel-label { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tel-value { font-size: 24px; color: #fff; font-weight: 800; }
        
        /* FIXED MATCHING ICON GRID CONTAINER */
        .chain-icons-container { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 4px; }
        .chain-icon-img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }

        .section-title { font-size: 20px; color: #fff; font-weight: 700; margin-bottom: 24px; }

        /* FIXED APPS GRID LAYER: Prevents component container breaks */
        .features-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; }
        .feature-card { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 10px; display: flex; flex-direction: column; gap: 16px; justify-content: space-between; }
        .card-header-meta { display: flex; justify-content: space-between; align-items: center; }
        .card-header-meta h4 { color: #fff; font-size: 16px; font-weight: 600; }
        .card-desc { color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
        
        .interactive-container-panel { background: var(--panel-inner); border: 1px solid var(--border); padding: 14px; border-radius: 6px; font-size: 11px; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .panel-label { color: var(--text-secondary); }
        .panel-value-accent { color: #fff; font-weight: 600; background: #1c1c24; padding: 2px 6px; border-radius: 3px; }
        
        .checkbox-item-wrapper { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; margin-top: 6px; }
        .checkbox-mock-indicator { width: 12px; height: 12px; background: var(--accent); border-radius: 2px; display: flex; align-items: center; justify-content: center; }
        .checkbox-mock-indicator::after { content: "✓"; color: #fff; font-size: 8px; font-weight: bold; }
        
        .input-mock-field { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; color: #fff; font-family: monospace; border-radius: 4px; font-size: 10px; margin-top: 6px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .balance-pill-badge { font-size: 9px; color: var(--neon); background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); padding: 2px 5px; border-radius: 3px; }

        .toggle-options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
        .toggle-opt-node { background: var(--bg); border: 1px solid var(--border); padding: 4px; border-radius: 3px; text-align: center; color: var(--text-secondary); font-size: 10px; }
        .toggle-opt-node.active-node-state { background: #fff; color: #000; }

        .feature-action { display: block; background: #fff; color: #000; padding: 10px; font-size: 12px; text-decoration: none; font-weight: 700; border-radius: 4px; text-align: center; transition: background 0.2s; }
        .feature-action:hover { background: #e4e4e7; }

        /* Draggable Action Base Box */
        .bookmarklet-box { border-top: 1px solid var(--border); padding: 80px 20px; text-align: center; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px; margin-bottom: 40px; }
        .box-title { font-size: 36px; color: #fff; margin-bottom: 24px; font-weight: 700; letter-spacing: -1px; }
        .drag-node-anchor { display: inline-block; background: #fff; color: #000; padding: 12px 24px; font-weight: 600; font-size: 13px; text-decoration: none; border-radius: 4px; cursor: move; }
        
        /* Link Columns Box Container */
        footer { border-top: 1px solid var(--border); padding-top: 40px; display: flex; justify-content: space-between; }
        .footer-logo { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .footer-subtext { color: var(--text-secondary); font-size: 11px; }
        .footer-links-grid { display: flex; gap: 60px; }
        .footer-col h5 { color: #fff; font-size: 11px; text-transform: uppercase; margin-bottom: 12px; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 8px; }
        .footer-col ul li a { color: var(--text-secondary); text-decoration: none; font-size: 12px; }
        .footer-col ul li a:hover { color: #fff; }

        @media(max-width: 900px) { .features-layout { grid-template-columns: 1fr; } .telemetry-row { grid-template-columns: 1fr; gap: 15px; } footer { flex-direction: column; gap: 30px; } }
    </style>
</head>
<body>

        <nav>
            <div class="nav-logo">Veluma</div>
        </nav>

        <div class="hero-section">
            <h2><span>Track on-chain data instantly.</span><br>No delay. No noise.</h2>
            <p class="hero-desc">Independent on-chain execution architecture. Run instant bundle analysis, map hidden distribution paths, and secure your wallet entries straight from your viewport layer.</p>
        </div>

        <!-- Telemetry Data Grid Box -->
        <div class="telemetry-row">
            <div class="telemetry-node">
                <div class="tel-label">Delay</div>
                <div class="tel-value">0.00ms</div>
            </div>
            <div class="telemetry-node">

                <div class="tel-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; opacity:0.7;"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
                    Supported Chains
                </div>

                <div class="chain-icons-container">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Solana">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="BSC">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Sui">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Base">
                    <img class="chain-icon-img" src="https://amazonaws.com" onerror="this.src='https://coingecko.com'" alt="Movement">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Ethereum">
                    <img class="chain-icon-img" src="https://pump.fun" onerror="this.style.background='#9eff00'; this.style.borderRadius='50%';" alt="Pump.fun">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Sonic">
                    <img class="chain-icon-img" src="https://coingecko.com" alt="Arbitrum">
                </div>
            </div>
        </div>

        <h3 class="section-title">Built-in Tools</h3>
        
        <!-- Interactive Showcases Layout Panel -->
        <div class="features-layout">
            <div class="feature-card">
